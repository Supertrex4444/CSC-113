<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GummyWorm.js — Sugar Rush</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --pink:        #ff6eb4;
      --pink-dim:    rgba(255,110,180,0.55);
      --lime:        #9aff6e;
      --lime-dim:    rgba(154,255,110,0.55);
      --blue:        #6eb4ff;
      --blue-dim:    rgba(110,180,255,0.55);
      --gold:        #ffd700;
      --bg:          #0d0618;
      --hud-glass:   rgba(255,255,255,0.07);
      --border:      rgba(255,255,255,0.12);
      --font-head:   'Bubblegum Sans', cursive;
      --font-ui:     'Nunito', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: #fff;
      font-family: var(--font-ui);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    #starfield {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    #app {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    #title-bar {
      text-align: center;
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    #title-bar h1 {
      font-family: var(--font-head);
      font-size: clamp(32px, 6vw, 54px);
      background: linear-gradient(90deg, var(--pink), var(--blue), var(--lime));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 15px var(--pink-dim));
    }

    #hud {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 560px;
    }
    .hud-card {
      flex: 1;
      background: var(--hud-glass);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 14px;
      backdrop-filter: blur(4px);
    }
    .hud-label { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.4); }
    .hud-value { font-size: 22px; font-weight: 900; }
    #score-card .hud-value { color: var(--lime); }
    #hi-card .hud-value { color: var(--pink); }
    #power-card .hud-value { font-size: 14px; color: var(--blue); }

    #canvas-wrap {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid var(--border);
      box-shadow: 0 0 40px rgba(0,0,0,0.5);
    }
    canvas { display: block; }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(13, 6, 24, 0.85);
      backdrop-filter: blur(8px);
      z-index: 10;
      transition: 0.4s;
      padding: 20px;
      text-align: center;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; transform: scale(1.1); }

    .menu-box {
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .how-to {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 15px 0;
    }
    .how-item {
      font-size: 11px;
      background: rgba(255,255,255,0.05);
      padding: 8px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .how-item strong { display: block; color: var(--lime); margin-bottom: 2px; }

    .btn-candy {
      font-family: var(--font-head);
      font-size: 22px;
      padding: 12px 40px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, var(--pink), #c035ff);
      color: white;
      box-shadow: 0 10px 20px rgba(255,110,180,0.3);
      transition: 0.2s;
    }
    .btn-candy:hover { transform: scale(1.05); filter: brightness(1.2); }

    #power-timer {
      height: 4px;
      background: var(--blue);
      width: 0%;
      margin-top: 4px;
      transition: width 0.1s linear;
      border-radius: 2px;
    }
  </style>
</head>
<body>

<canvas id="starfield"></canvas>

<div id="app">
  <div id="title-bar">
    <h1>GummyWorm.js</h1>
  </div>

  <div id="hud">
    <div class="hud-card" id="score-card">
      <div class="hud-label">Sugar Score</div>
      <div class="hud-value" id="score-val">0</div>
    </div>
    <div class="hud-card" id="power-card">
      <div class="hud-label">Power Up</div>
      <div class="hud-value" id="power-val">None</div>
      <div id="power-timer"></div>
    </div>
    <div class="hud-card" id="hi-card">
      <div class="hud-label">High Score</div>
      <div class="hud-value" id="hi-val">0</div>
    </div>
  </div>

  <div id="canvas-wrap">
    <canvas id="game"></canvas>

    <div class="overlay" id="overlay-start">
      <div class="menu-box">
        <h2 style="font-family:var(--font-head); font-size:36px; color:var(--blue)">Sweet Adventure!</h2>
        <div class="how-to">
          <div class="how-item"><strong>Move</strong>Arrow Keys / WASD</div>
          <div class="how-item"><strong>Crystals</strong>Grow & Score</div>
          <div class="how-item" style="border-color:var(--blue)"><strong>Mint</strong>Slow Motion</div>
          <div class="how-item" style="border-color:var(--gold)"><strong>Honey</strong>Invincibility</div>
        </div>
        <button class="btn-candy" id="btn-start">START GAME</button>
      </div>
    </div>

    <div class="overlay hidden" id="overlay-gameover">
      <h2 style="font-family:var(--font-head); font-size:48px; color:var(--pink)">Sugar Crash!</h2>
      <div id="final-score" style="font-size:24px; margin-bottom:20px;">Score: 0</div>
      <button class="btn-candy" id="btn-restart" style="background:linear-gradient(135deg, var(--lime), #35ffc4); color:#000;">TRY AGAIN</button>
    </div>
  </div>
</div>

<script>
/* ---- CONSTANTS & CONFIG ---- */
const CELL = 22;
const COLS = 26;
const ROWS = 26;
const W = COLS * CELL;
const H = ROWS * CELL;

const State = { IDLE: 'idle', PLAYING: 'playing', DYING: 'dying', GAMEOVER: 'gameover' };
const PowerType = { NONE: 'None', SLOW: 'Blue Mint', GHOST: 'Golden Honey' };

// Gummy Color Palette
const CANDY_COLORS = [
  '#ff4fa0', // Cherry Pink
  '#9aff6e', // Lime Green
  '#6eb4ff', // Blue Raspberry
  '#ffd94a', // Lemon Yellow
  '#ff9d4a'  // Orange
];

let state = State.IDLE;
let snake = [];
let dir = { x: 1, y: 0 };
let nextDir = { x: 1, y: 0 };
let food = { x: 0, y: 0, type: 0 }; 
let particles = [];
let score = 0;
let hiScore = parseInt(localStorage.getItem('gw_hiscore_v2') || '0', 10);
let activePower = PowerType.NONE;
let powerTime = 0;
let colorCycleIndex = 0;
const POWER_DURATION = 5000;

let lastTick = 0;
let lastRafTime = 0;
let segPositions = [];
let dissolveAlpha = 1.0;

/* ---- CANVAS SETUP ---- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = W;
canvas.height = H;

/* ---- BACKGROUND ANIMATION ---- */
const sf = document.getElementById('starfield');
const sctx = sf.getContext('2d');
let stars = [];
function initSF() {
  sf.width = window.innerWidth; sf.height = window.innerHeight;
  stars = Array.from({length: 80}, () => ({
    x: Math.random() * sf.width, y: Math.random() * sf.height,
    s: Math.random() * 2 + 1, o: Math.random()
  }));
}
function drawSF() {
  sctx.clearRect(0,0,sf.width,sf.height);
  stars.forEach(s => {
    s.y += s.s; if(s.y > sf.height) s.y = -10;
    sctx.fillStyle = `rgba(255, 110, 180, ${s.o * 0.3})`;
    sctx.beginPath(); sctx.arc(s.x, s.y, s.s, 0, 6.28); sctx.fill();
  });
  requestAnimationFrame(drawSF);
}
window.addEventListener('resize', initSF);
initSF(); drawSF();

/* ---- GAME LOGIC ---- */
function placeFood() {
  const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
  let x, y;
  do {
    x = Math.floor(Math.random() * COLS);
    y = Math.floor(Math.random() * ROWS);
  } while (occupied.has(`${x},${y}`));
  
  const rng = Math.random();
  let type = 0;
  if(rng > 0.94) type = 2; 
  else if(rng > 0.88) type = 1; 

  food = { x, y, type, shape: Math.floor(Math.random() * 3) };
}

function spawnParticles(x, y, color) {
  for(let i=0; i<12; i++) {
    particles.push({
      x: x * CELL + CELL/2, y: y * CELL + CELL/2,
      vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6,
      life: 1.0, color: color
    });
  }
}

function startGame() {
  const cx = Math.floor(COLS/2);
  const cy = Math.floor(ROWS/2);
  colorCycleIndex = 0;
  
  // Initialize snake with alternating colors
  snake = [
    {x:cx, y:cy, color: CANDY_COLORS[0]},
    {x:cx-1, y:cy, color: CANDY_COLORS[1]},
    {x:cx-2, y:cy, color: CANDY_COLORS[2]}
  ];
  
  segPositions = snake.map(s => ({vx: s.x*CELL, vy: s.y*CELL}));
  dir = {x:1, y:0}; nextDir = {x:1, y:0};
  score = 0; activePower = PowerType.NONE; powerTime = 0;
  placeFood();
  state = State.PLAYING;
  document.getElementById('overlay-start').classList.add('hidden');
  document.getElementById('overlay-gameover').classList.add('hidden');
  lastTick = performance.now();
}

function tick() {
  dir = {...nextDir};
  const head = snake[0];
  const newHeadPos = { x: head.x + dir.x, y: head.y + dir.y };

  if (newHeadPos.x < 0 || newHeadPos.x >= COLS || newHeadPos.y < 0 || newHeadPos.y >= ROWS) return false;

  if (activePower !== PowerType.GHOST) {
    for (let i = 0; i < snake.length - 1; i++) {
      if (snake[i].x === newHeadPos.x && snake[i].y === newHeadPos.y) return false;
    }
  }

  const ate = newHeadPos.x === food.x && newHeadPos.y === food.y;
  
  // Cycle colors for the new head
  colorCycleIndex = (colorCycleIndex + 1) % CANDY_COLORS.length;
  const newHead = { ...newHeadPos, color: CANDY_COLORS[colorCycleIndex] };
  
  snake.unshift(newHead);
  segPositions.unshift({vx: segPositions[0].vx, vy: segPositions[0].vy});

  if (ate) {
    score += (food.type > 0 ? 5 : 1);
    const pColor = food.type === 1 ? '#6eb4ff' : (food.type === 2 ? '#ffd700' : '#ffd94a');
    spawnParticles(food.x, food.y, pColor);
    
    if (food.type === 1) { activePower = PowerType.SLOW; powerTime = POWER_DURATION; }
    else if (food.type === 2) { activePower = PowerType.GHOST; powerTime = POWER_DURATION; }
    
    if (score > hiScore) { hiScore = score; localStorage.setItem('gw_hiscore_v2', hiScore); }
    placeFood();
  } else {
    snake.pop(); segPositions.pop();
  }
  return true;
}

/* ---- RENDERING ---- */
function drawCrystal(f, pulse) {
  const cx = f.x * CELL + CELL/2;
  const cy = f.y * CELL + CELL/2;
  const s = (CELL/2 - 4) + Math.sin(pulse)*2;
  
  ctx.save();
  ctx.translate(cx, cy);
  
  let color = '#ffd94a';
  if(f.type === 1) color = '#6eb4ff';
  if(f.type === 2) color = '#ffd700';

  ctx.shadowBlur = 20;
  ctx.shadowColor = color;
  ctx.fillStyle = color;

  ctx.beginPath();
  if(f.shape === 0) ctx.arc(0, 0, s, 0, 6.28); 
  else if(f.shape === 1) { 
    ctx.rotate(Math.PI/4); ctx.rect(-s,-s,s*2,s*2);
  } else { 
    ctx.moveTo(0, s/2);
    ctx.bezierCurveTo(s, -s, s*2, s/2, 0, s);
    ctx.bezierCurveTo(-s*2, s/2, -s, -s, 0, s/2);
  }
  ctx.fill();
  ctx.restore();
}

function render() {
  ctx.fillStyle = '#0d0618';
  ctx.fillRect(0,0,W,H);
  
  // Subtle Grid
  ctx.strokeStyle = 'rgba(255,255,255,0.02)';
  for(let i=0; i<=COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(W,i*CELL); ctx.stroke();
  }

  const time = performance.now() / 200;
  drawCrystal(food, time);

  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.life -= 0.02;
    ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillRect(p.x, p.y, 3, 3);
  });
  ctx.globalAlpha = 1;

  const isGhost = activePower === PowerType.GHOST;
  
  // Render Worm Segments
  snake.forEach((s, i) => {
    const targetX = s.x * CELL;
    const targetY = s.y * CELL;
    const ease = 0.35 - (i * 0.005);
    segPositions[i].vx += (targetX - segPositions[i].vx) * ease;
    segPositions[i].vy += (targetY - segPositions[i].vy) * ease;

    ctx.save();
    ctx.globalAlpha = isGhost ? 0.4 : (state === State.DYING ? dissolveAlpha : 0.9);
    ctx.translate(segPositions[i].vx + CELL/2, segPositions[i].vy + CELL/2);
    
    // Multi-color Gummy Body
    ctx.fillStyle = isGhost ? '#fffad1' : s.color;
    
    // Gummy Glow Effect
    ctx.shadowBlur = 10;
    ctx.shadowColor = ctx.fillStyle;

    const r = i === 0 ? 10 : 8;
    ctx.beginPath(); 
    ctx.roundRect(-CELL/2+2, -CELL/2+2, CELL-4, CELL-4, r); 
    ctx.fill();

    // Shine highlight for "gelatin" look
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.roundRect(-CELL/2+5, -CELL/2+5, CELL/3, CELL/5, 2);
    ctx.fill();

    // Eyes for the head
    if(i === 0) {
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(-4, -2, 2.5, 0, 6.28); ctx.fill();
      ctx.beginPath(); ctx.arc(4, -2, 2.5, 0, 6.28); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-4.5, -3, 0.8, 0, 6.28); ctx.fill();
      ctx.beginPath(); ctx.arc(3.5, -3, 0.8, 0, 6.28); ctx.fill();
    }
    ctx.restore();
  });
}

function updateUI(dt) {
  document.getElementById('score-val').textContent = score;
  document.getElementById('hi-val').textContent = hiScore;
  document.getElementById('power-val').textContent = activePower;
  
  const bar = document.getElementById('power-timer');
  if(activePower !== PowerType.NONE) {
    powerTime -= dt;
    bar.style.width = (powerTime / POWER_DURATION * 100) + '%';
    if(powerTime <= 0) activePower = PowerType.NONE;
  } else {
    bar.style.width = '0%';
  }
}

function loop(timestamp) {
  const dt = timestamp - lastRafTime;
  lastRafTime = timestamp;

  if (state === State.PLAYING) {
    updateUI(dt);
    let speed = Math.max(50, 130 - (score * 1.5));
    if(activePower === PowerType.SLOW) speed = 240;

    if (timestamp - lastTick >= speed) {
      lastTick = timestamp;
      if (!tick()) { state = State.DYING; dissolveAlpha = 1; }
    }
  } else if (state === State.DYING) {
    dissolveAlpha -= 0.02;
    if (dissolveAlpha <= 0) {
      state = State.GAMEOVER;
      document.getElementById('overlay-gameover').classList.remove('hidden');
      document.getElementById('final-score').textContent = "Score: " + score;
    }
  }

  render();
  requestAnimationFrame(loop);
}

const keys = {
  ArrowUp: {x:0, y:-1}, w: {x:0, y:-1},
  ArrowDown: {x:0, y:1}, s: {x:0, y:1},
  ArrowLeft: {x:-1, y:0}, a: {x:-1, y:0},
  ArrowRight: {x:1, y:0}, d: {x:1, y:0}
};
window.addEventListener('keydown', e => {
  if (keys[e.key]) {
    const move = keys[e.key];
    if (move.x !== -dir.x && move.y !== -dir.y) nextDir = move;
    e.preventDefault();
  }
});

document.getElementById('btn-start').onclick = startGame;
document.getElementById('btn-restart').onclick = startGame;

requestAnimationFrame(loop);
</script>
</body>
</html>
