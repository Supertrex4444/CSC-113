<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GummyWorm.js — Sugar Rush</title>

  <!-- =====================================================
       FONTS — Bubblegum Sans for headings, Nunito for UI
  ====================================================== -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet" />

  <style>
    /* =====================================================
       CSS VARIABLES & RESET
    ====================================================== */
    :root {
      --pink:        #ff6eb4;
      --pink-dim:    rgba(255,110,180,0.55);
      --lime:        #9aff6e;
      --lime-dim:    rgba(154,255,110,0.55);
      --blue:        #6eb4ff;
      --blue-dim:    rgba(110,180,255,0.55);
      --candy-head:  #ff4fa0;
      --candy-body:  rgba(255,110,180,0.80);
      --food-color:  #ffd94a;
      --food-glow:   rgba(255,217,74,0.7);
      --bg:          #0d0618;
      --bg2:         #160a2a;
      --grid-line:   rgba(255,255,255,0.04);
      --hud-glass:   rgba(255,255,255,0.07);
      --border:      rgba(255,255,255,0.12);
      --font-head:   'Bubblegum Sans', cursive;
      --font-ui:     'Nunito', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: #fff;
      font-family: var(--font-ui);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    /* =====================================================
       STARFIELD BACKGROUND
    ====================================================== */
    #starfield {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* =====================================================
       MAIN WRAPPER
    ====================================================== */
    #app {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* =====================================================
       TITLE
    ====================================================== */
    #title-bar {
      text-align: center;
      line-height: 1;
    }
    #title-bar h1 {
      font-family: var(--font-head);
      font-size: clamp(28px, 5vw, 42px);
      letter-spacing: 1px;
      background: linear-gradient(90deg, var(--pink), var(--blue), var(--lime));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 12px var(--pink-dim));
    }
    #title-bar .subtitle {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-top: 3px;
    }

    /* =====================================================
       HUD — score strip above canvas
    ====================================================== */
    #hud {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 560px;
    }
    .hud-card {
      flex: 1;
      background: var(--hud-glass);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      padding: 8px 14px;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .hud-label {
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
    }
    .hud-value {
      font-size: 22px;
      font-weight: 900;
      color: #fff;
      line-height: 1;
    }
    #score-card .hud-value { color: var(--lime); text-shadow: 0 0 10px var(--lime-dim); }
    #hi-card   .hud-value { color: var(--pink); text-shadow: 0 0 10px var(--pink-dim); }
    #speed-card .hud-value { color: var(--blue); text-shadow: 0 0 10px rgba(110,180,255,.6); }

    /* =====================================================
       CANVAS CONTAINER
    ====================================================== */
    #canvas-wrap {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow:
        0 0 0 1px rgba(255,110,180,0.1),
        0 0 60px rgba(255,110,180,0.08),
        0 0 120px rgba(110,180,255,0.06);
    }
    canvas {
      display: block;
    }

    /* =====================================================
       OVERLAYS (shared base)
    ====================================================== */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: rgba(13, 6, 24, 0.82);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: opacity 0.35s ease;
      z-index: 10;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }

    .overlay-title {
      font-family: var(--font-head);
      font-size: clamp(30px, 6vw, 52px);
      letter-spacing: 1px;
      text-align: center;
      line-height: 1.1;
    }
    .overlay-sub {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.5px;
      text-align: center;
    }
    .overlay-score {
      font-family: var(--font-head);
      font-size: 20px;
      color: var(--lime);
      text-shadow: 0 0 12px var(--lime-dim);
    }

    /* fancy key badge */
    .key-hint {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: rgba(255,255,255,0.45);
    }
    .key {
      background: rgba(255,255,255,0.1);
      border: 0.5px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
    }

    /* CTA buttons */
    .btn-candy {
      font-family: var(--font-head);
      font-size: 18px;
      letter-spacing: 1px;
      padding: 10px 36px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.1s ease;
    }
    .btn-candy:active { transform: scale(0.96); }

    .btn-start {
      background: linear-gradient(135deg, var(--pink), #c035ff);
      color: #fff;
      box-shadow: 0 0 24px rgba(255,110,180,0.4);
    }
    .btn-start:hover { filter: brightness(1.15); }

    .btn-restart {
      background: linear-gradient(135deg, var(--lime), #35ffc4);
      color: #0d0618;
      box-shadow: 0 0 24px rgba(154,255,110,0.4);
    }
    .btn-restart:hover { filter: brightness(1.1); }

    /* =====================================================
       INSTRUCTIONS STRIP
    ====================================================== */
    #instructions {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 560px;
    }
    #instructions span {
      font-size: 11px;
      color: rgba(255,255,255,0.28);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    #instructions .key { font-size: 10px; padding: 2px 6px; }
  </style>
</head>
<body>

<!-- =====================================================
     STARFIELD CANVAS
====================================================== -->
<canvas id="starfield"></canvas>

<div id="app">

  <!-- TITLE -->
  <div id="title-bar">
    <h1>GummyWorm.js</h1>
    <p class="subtitle">Sugar Rush Edition</p>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-card" id="score-card">
      <div class="hud-label">Score</div>
      <div class="hud-value" id="score-val">0</div>
    </div>
    <div class="hud-card" id="hi-card">
      <div class="hud-label">Highest Sugar Rush</div>
      <div class="hud-value" id="hi-val">0</div>
    </div>
    <div class="hud-card" id="speed-card">
      <div class="hud-label">Speed</div>
      <div class="hud-value" id="speed-val">1</div>
    </div>
  </div>

  <!-- GAME CANVAS -->
  <div id="canvas-wrap">
    <canvas id="game"></canvas>

    <!-- START OVERLAY -->
    <div class="overlay" id="overlay-start">
      <div class="overlay-title" style="background:linear-gradient(90deg,var(--pink),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">
        Press Space<br>to Start
      </div>
      <div class="overlay-sub">Eat Sugar Crystals · Avoid the walls · Don't bite yourself</div>
      <div class="key-hint">
        <span class="key">SPACE</span> or click the button below
      </div>
      <button class="btn-candy btn-start" id="btn-start">Start Game</button>
    </div>

    <!-- GAME OVER OVERLAY -->
    <div class="overlay hidden" id="overlay-gameover">
      <div class="overlay-title" style="color:var(--pink);text-shadow:0 0 20px var(--pink-dim);">
        Sugar Crash!
      </div>
      <div class="overlay-score" id="final-score">Score: 0</div>
      <div class="overlay-sub" id="new-record" style="color:var(--lime);display:none;">🍬 New High Score!</div>
      <button class="btn-candy btn-restart" id="btn-restart">Play Again</button>
      <div class="key-hint"><span class="key">R</span> to restart</div>
    </div>
  </div>

  <!-- CONTROLS HINT -->
  <div id="instructions">
    <span><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> or Arrow Keys — steer</span>
    <span><span class="key">R</span> — restart</span>
  </div>

</div><!-- /app -->

<script>
/* =====================================================================
   GummyWorm.js — Main Game Script
   Sections:
     1.  Constants & Configuration
     2.  Starfield (background effect)
     3.  Game State
     4.  Canvas Setup
     5.  Input Handling
     6.  Game Logic (update, collision)
     7.  Rendering (drawWorm, drawFood, drawGrid, drawHUD)
     8.  Animation / Game Loop
     9.  Overlay / UI helpers
     10. Bootstrap
===================================================================== */

/* ---- 1. CONSTANTS & CONFIGURATION ---------------------------------- */
const CELL   = 20;          // grid cell size in pixels
const COLS   = 28;          // grid columns
const ROWS   = 28;          // grid rows
const W      = COLS * CELL; // canvas width
const H      = ROWS * CELL; // canvas height

const BASE_INTERVAL  = 130; // ms between ticks at speed 1
const MIN_INTERVAL   = 55;  // fastest tick (speed cap)
const SPEED_EVERY    = 5;   // items before speed bump

// Gummy worm palette — pink/magenta theme
const WORM_HEAD_COLOR = '#ff4fa0';
const WORM_BODY_COLOR = 'rgba(255,90,180,0.82)';
const WORM_SHINE      = 'rgba(255,255,255,0.35)';
const WORM_SHADOW     = 'rgba(180,0,100,0.4)';

// Food / Sugar Crystal
const FOOD_COLOR  = '#ffd94a';
const FOOD_GLOW   = 'rgba(255,220,80,0.7)';
const FOOD_INNER  = 'rgba(255,255,200,0.9)';

/* ---- 2. STARFIELD --------------------------------------------------- */
(function initStarfield() {
  const sf   = document.getElementById('starfield');
  const ctx  = sf.getContext('2d');
  let stars  = [];

  function resize() {
    sf.width  = window.innerWidth;
    sf.height = window.innerHeight;
    stars = Array.from({ length: 120 }, () => ({
      x:  Math.random() * sf.width,
      y:  Math.random() * sf.height,
      r:  Math.random() * 1.2 + 0.2,
      a:  Math.random(),
      da: (Math.random() - 0.5) * 0.005
    }));
  }

  function tick() {
    ctx.clearRect(0, 0, sf.width, sf.height);
    for (const s of stars) {
      s.a = Math.max(0.05, Math.min(1, s.a + s.da));
      if (s.a <= 0.05 || s.a >= 1) s.da *= -1;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${s.a.toFixed(2)})`;
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }

  window.addEventListener('resize', resize);
  resize();
  tick();
})();

/* ---- 3. GAME STATE -------------------------------------------------- */
const State = {
  IDLE:     'idle',
  PLAYING:  'playing',
  GAMEOVER: 'gameover',
  DYING:    'dying'  // worm dissolve animation
};

let state       = State.IDLE;
let snake       = [];       // array of {x, y} grid positions, index 0 = head
let dir         = { x: 1, y: 0 };  // current direction
let nextDir     = { x: 1, y: 0 };  // queued direction (applied next tick)
let food        = { x: 0, y: 0 };
let score       = 0;
let hiScore     = parseInt(localStorage.getItem('gw_hiscore') || '0', 10);
let speedLevel  = 1;
let tickInterval = BASE_INTERVAL;
let lastTick    = 0;
let lastRafTime = 0;
let animId      = null;

// Smooth rendering: each segment has a "visual" position that lags behind the grid
let segPositions = [];  // array of {vx, vy} in pixel space (for squish effect)

// Death animation state
let dissolveAlpha = 1.0;

// Food pulse state
let foodPulse = 0;

/* ---- 4. CANVAS SETUP ----------------------------------------------- */
const gameCanvas = document.getElementById('game');
const gctx       = gameCanvas.getContext('2d');
gameCanvas.width  = W;
gameCanvas.height = H;

/* ---- 5. INPUT HANDLING --------------------------------------------- */
const KEY_MAP = {
  ArrowUp:    { x: 0, y: -1 }, w: { x: 0, y: -1 }, W: { x: 0, y: -1 },
  ArrowDown:  { x: 0, y:  1 }, s: { x: 0, y:  1 }, S: { x: 0, y:  1 },
  ArrowLeft:  { x: -1, y: 0 }, a: { x: -1, y: 0 }, A: { x: -1, y: 0 },
  ArrowRight: { x:  1, y: 0 }, d: { x:  1, y: 0 }, D: { x:  1, y: 0 }
};

document.addEventListener('keydown', (e) => {
  // Start game
  if (e.code === 'Space' && state === State.IDLE) { startGame(); return; }

  // Restart
  if ((e.key === 'r' || e.key === 'R') && (state === State.GAMEOVER || state === State.IDLE)) {
    startGame(); return;
  }

  // Direction input — only during active play
  if (state !== State.PLAYING) return;

  const d = KEY_MAP[e.key];
  if (!d) return;

  // Prevent 180° reversal
  if (d.x === -dir.x && d.y === -dir.y) return;
  nextDir = d;

  // Prevent default scrolling for arrow keys
  if (e.key.startsWith('Arrow')) e.preventDefault();
});

/* ---- 6. GAME LOGIC -------------------------------------------------- */

/** Place food at a random cell not occupied by the snake */
function placeFood() {
  let pos;
  const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
  do {
    pos = {
      x: Math.floor(Math.random() * COLS),
      y: Math.floor(Math.random() * ROWS)
    };
  } while (occupied.has(`${pos.x},${pos.y}`));
  food = pos;
}

/** Initialize / reset game state and start */
function startGame() {
  // Build initial worm in centre, 4 segments long, heading right
  const cx = Math.floor(COLS / 2);
  const cy = Math.floor(ROWS / 2);
  snake = [
    { x: cx,     y: cy },
    { x: cx - 1, y: cy },
    { x: cx - 2, y: cy },
    { x: cx - 3, y: cy }
  ];

  // Initialize smooth visual positions at exact grid pixels
  segPositions = snake.map(s => ({ vx: s.x * CELL, vy: s.y * CELL }));

  dir       = { x: 1, y: 0 };
  nextDir   = { x: 1, y: 0 };
  score     = 0;
  speedLevel = 1;
  tickInterval = BASE_INTERVAL;
  dissolveAlpha = 1.0;
  foodPulse = 0;

  placeFood();
  updateHUD();

  state = State.PLAYING;
  hideOverlay('overlay-start');
  hideOverlay('overlay-gameover');

  // Reset RAF
  lastTick    = performance.now();
  lastRafTime = performance.now();
  if (animId) cancelAnimationFrame(animId);
  animId = requestAnimationFrame(gameLoop);
}

/** Advance snake one grid step; return false if collision */
function tick() {
  // Apply queued direction
  dir = { ...nextDir };

  // Compute new head position
  const head    = snake[0];
  const newHead = { x: head.x + dir.x, y: head.y + dir.y };

  // --- Wall collision ---
  if (newHead.x < 0 || newHead.x >= COLS || newHead.y < 0 || newHead.y >= ROWS) {
    return false; // death
  }

  // --- Self collision (skip tail tip — it's about to move) ---
  for (let i = 0; i < snake.length - 1; i++) {
    if (snake[i].x === newHead.x && snake[i].y === newHead.y) return false;
  }

  // --- Food collision ---
  const ate = newHead.x === food.x && newHead.y === food.y;

  // Shift snake forward: prepend new head
  snake.unshift(newHead);
  // Prepend a new visual position (starts at old head's visual pos for smooth lag)
  segPositions.unshift({ vx: segPositions[0]?.vx ?? newHead.x * CELL, vy: segPositions[0]?.vy ?? newHead.y * CELL });

  if (ate) {
    score++;
    // Speed up every SPEED_EVERY crystals consumed
    speedLevel = Math.floor(score / SPEED_EVERY) + 1;
    tickInterval = Math.max(MIN_INTERVAL, BASE_INTERVAL - (speedLevel - 1) * 12);
    placeFood();
    // Update high score immediately
    if (score > hiScore) {
      hiScore = score;
      localStorage.setItem('gw_hiscore', hiScore);
    }
    updateHUD();
  } else {
    // Remove tail
    snake.pop();
    segPositions.pop();
  }

  return true; // alive
}

/** Trigger game-over death animation */
function triggerDeath() {
  state = State.DYING;
  dissolveAlpha = 1.0;
}

/* ---- 7. RENDERING --------------------------------------------------- */

/** Draw the background grid */
function drawGrid() {
  gctx.strokeStyle = 'rgba(255,255,255,0.03)';
  gctx.lineWidth   = 0.5;

  for (let c = 0; c <= COLS; c++) {
    gctx.beginPath();
    gctx.moveTo(c * CELL, 0);
    gctx.lineTo(c * CELL, H);
    gctx.stroke();
  }
  for (let r = 0; r <= ROWS; r++) {
    gctx.beginPath();
    gctx.moveTo(0, r * CELL);
    gctx.lineTo(W, r * CELL);
    gctx.stroke();
  }
}

/** Draw one gummy segment (rounded rect + highlight + shadow) */
function drawSegment(vx, vy, isHead, alpha) {
  const pad  = isHead ? 1 : 2;   // head slightly larger
  const rad  = isHead ? 9 : 7;   // corner radius
  const size = CELL - pad * 2;
  const x    = vx + pad;
  const y    = vy + pad;

  gctx.save();
  gctx.globalAlpha = alpha;

  // Drop shadow (gives gummy depth)
  gctx.shadowColor  = WORM_SHADOW;
  gctx.shadowBlur   = isHead ? 10 : 6;
  gctx.shadowOffsetY = 2;

  // Main gummy body
  gctx.beginPath();
  roundRect(gctx, x, y, size, size, rad);
  gctx.fillStyle = isHead ? WORM_HEAD_COLOR : WORM_BODY_COLOR;
  gctx.fill();

  // Shine highlight (top-left gleam)
  gctx.shadowColor = 'transparent';
  gctx.shadowBlur  = 0;
  gctx.shadowOffsetY = 0;

  const shinePad = 3;
  gctx.beginPath();
  roundRect(gctx, x + shinePad, y + shinePad, size * 0.42, size * 0.28, 3);
  gctx.fillStyle = WORM_SHINE;
  gctx.fill();

  // Head: draw eyes
  if (isHead) {
    drawEyes(vx, vy, alpha);
  }

  gctx.restore();
}

/** Draw cute gummy eyes on the head, oriented toward movement direction */
function drawEyes(vx, vy, alpha) {
  // Eye positions relative to direction
  const cx = vx + CELL / 2;
  const cy = vy + CELL / 2;

  // Offset perpendicular to direction for two eyes
  const perp = { x: -dir.y, y: dir.x };
  const fwd  = { x: dir.x, y: dir.y };

  const eyeOff = 3.5; // distance from center along perpendicular
  const eyeFwd = 2.5; // how far forward

  const e1 = {
    x: cx + perp.x * eyeOff + fwd.x * eyeFwd,
    y: cy + perp.y * eyeOff + fwd.y * eyeFwd
  };
  const e2 = {
    x: cx - perp.x * eyeOff + fwd.x * eyeFwd,
    y: cy - perp.y * eyeOff + fwd.y * eyeFwd
  };

  gctx.save();
  gctx.globalAlpha = alpha;

  for (const e of [e1, e2]) {
    // Outer eye (white-ish sclera)
    gctx.beginPath();
    gctx.arc(e.x, e.y, 2.6, 0, Math.PI * 2);
    gctx.fillStyle = 'rgba(255,255,255,0.92)';
    gctx.fill();

    // Pupil
    gctx.beginPath();
    gctx.arc(e.x + fwd.x * 0.5, e.y + fwd.y * 0.5, 1.4, 0, Math.PI * 2);
    gctx.fillStyle = '#1a0033';
    gctx.fill();
  }
  gctx.restore();
}

/**
 * Draw the gummy worm using smooth interpolated (lagged) positions
 * to create the squish / gelatinous feel.
 */
function drawWorm(alpha) {
  // Easing coefficient for segment lag — earlier segments catch up faster
  const EASE_BASE = 0.32; // head catch-up speed

  for (let i = 0; i < snake.length; i++) {
    // Target position (exact grid pixel)
    const targetX = snake[i].x * CELL;
    const targetY = snake[i].y * CELL;

    // Ease toward target — tail segments lag more (lower ease coefficient)
    const ease = EASE_BASE * Math.max(0.35, 1 - i * 0.04);
    segPositions[i].vx += (targetX - segPositions[i].vx) * ease;
    segPositions[i].vy += (targetY - segPositions[i].vy) * ease;

    const isHead = i === 0;
    drawSegment(segPositions[i].vx, segPositions[i].vy, isHead, alpha);
  }
}

/** Draw the Sugar Crystal food item with pulse/glow effect */
function drawFood() {
  foodPulse += 0.07;
  const pulse  = Math.sin(foodPulse) * 0.5 + 0.5;  // 0 → 1 → 0
  const glowR  = 12 + pulse * 8;
  const size   = CELL - 4;
  const fx     = food.x * CELL + 2;
  const fy     = food.y * CELL + 2;
  const cx     = food.x * CELL + CELL / 2;
  const cy     = food.y * CELL + CELL / 2;

  gctx.save();

  // Outer glow
  const grad = gctx.createRadialGradient(cx, cy, 2, cx, cy, glowR + 4);
  grad.addColorStop(0, FOOD_GLOW);
  grad.addColorStop(1, 'transparent');
  gctx.beginPath();
  gctx.arc(cx, cy, glowR + 4, 0, Math.PI * 2);
  gctx.fillStyle = grad;
  gctx.fill();

  // Crystal body — rotated diamond square
  gctx.translate(cx, cy);
  gctx.rotate(Math.PI / 4 + foodPulse * 0.3);
  gctx.translate(-CELL / 2 + 2, -CELL / 2 + 2);

  gctx.shadowColor = FOOD_GLOW;
  gctx.shadowBlur  = 14 + pulse * 8;

  roundRect(gctx, 2, 2, size - 4, size - 4, 4);
  gctx.fillStyle = FOOD_COLOR;
  gctx.fill();

  // Inner sparkle
  gctx.shadowBlur  = 0;
  roundRect(gctx, 6, 6, size - 12, size - 12, 2);
  gctx.fillStyle = FOOD_INNER;
  gctx.fill();

  gctx.restore();
}

/** Helper: rounded rectangle path (polyfill for older browsers) */
function roundRect(ctx, x, y, w, h, r) {
  if (ctx.roundRect) {
    ctx.roundRect(x, y, w, h, r);
  } else {
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }
}

/** Render a single frame */
function render(dying) {
  // Background
  gctx.fillStyle = '#0d0618';
  gctx.fillRect(0, 0, W, H);

  drawGrid();
  drawFood();

  const alpha = dying ? dissolveAlpha : 1.0;
  drawWorm(alpha);
}

/* ---- 8. GAME LOOP --------------------------------------------------- */

function gameLoop(timestamp) {
  const dt = timestamp - lastRafTime;
  lastRafTime = timestamp;

  if (state === State.PLAYING) {
    // Render every frame for smooth interpolation
    render(false);

    // Advance game logic on fixed tick interval
    if (timestamp - lastTick >= tickInterval) {
      lastTick = timestamp;
      const alive = tick();
      if (!alive) triggerDeath();
    }

    animId = requestAnimationFrame(gameLoop);

  } else if (state === State.DYING) {
    // Dissolve worm over ~600ms
    dissolveAlpha -= dt / 600;
    render(true);

    if (dissolveAlpha <= 0) {
      dissolveAlpha = 0;
      state = State.GAMEOVER;
      showGameOver();
      return; // stop loop
    }

    animId = requestAnimationFrame(gameLoop);

  } else {
    // IDLE or GAMEOVER — just keep drawing static frame
    render(false);
    animId = requestAnimationFrame(gameLoop);
  }
}

/* ---- 9. OVERLAY / UI HELPERS --------------------------------------- */

function updateHUD() {
  document.getElementById('score-val').textContent = score;
  document.getElementById('hi-val').textContent    = hiScore;
  document.getElementById('speed-val').textContent = speedLevel;
}

function showGameOver() {
  const newRecord = score >= hiScore && score > 0;
  document.getElementById('final-score').textContent = `Score: ${score}`;
  const nr = document.getElementById('new-record');
  nr.style.display = newRecord ? 'block' : 'none';
  updateHUD();
  showOverlay('overlay-gameover');
}

function showOverlay(id) {
  document.getElementById(id).classList.remove('hidden');
}
function hideOverlay(id) {
  document.getElementById(id).classList.add('hidden');
}

/* ---- 10. BOOTSTRAP ------------------------------------------------- */

// Button handlers
document.getElementById('btn-start').addEventListener('click', startGame);
document.getElementById('btn-restart').addEventListener('click', startGame);

// Draw initial idle frame (empty grid)
updateHUD();

// Start the idle loop (renders the empty board + overlays)
animId = requestAnimationFrame(gameLoop);

</script>
